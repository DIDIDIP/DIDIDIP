<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="DIDIDIP terminal">
  <style>
    .t { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 17px; }
    .p { fill: #3fb950; } .d { fill: #58a6ff; } .w { fill: #e6edf3; } .m { fill: #8b949e; } .y { fill: #d29922; } .k { fill: #bc8cff; }
  </style>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="80" height="30" width="0"><animate attributeName="width" from="0" to="900" begin="0.3s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="110" height="30" width="0"><animate attributeName="width" from="0" to="900" begin="1.5s" dur="0.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="140" height="30" width="0"><animate attributeName="width" from="0" to="900" begin="2s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="170" height="30" width="0"><animate attributeName="width" from="0" to="900" begin="3.2s" dur="0.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="200" height="30" width="0"><animate attributeName="width" from="0" to="900" begin="3.7s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="0" y="230" height="30" width="0"><animate attributeName="width" from="0" to="900" begin="4.9s" dur="1.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="298" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 13a12 12 0 0 1 12-12h874a12 12 0 0 1 12 12v31H1z" fill="url(#bar)"/>
  <line x1="1" y1="44" x2="899" y2="44" stroke="#30363d" stroke-width="1"/>
  <circle cx="26" cy="23" r="7" fill="#ff5f56"/><circle cx="48" cy="23" r="7" fill="#ffbd2e"/><circle cx="70" cy="23" r="7" fill="#27c93f"/>
  <text x="450" y="28" text-anchor="middle" class="t m" font-size="14">didi@physical-ai: ~</text>

  <g class="t">
    <text x="28" y="100" clip-path="url(#c1)"><tspan class="p">didi@physical-ai</tspan><tspan class="w">:</tspan><tspan class="d">~</tspan><tspan class="w">$ whoami</tspan></text>
    <text x="28" y="130" clip-path="url(#c2)"><tspan class="m">&gt; </tspan><tspan class="w">DIDIDIP</tspan><tspan class="m"> // Physical AI developer in training</tspan></text>
    <text x="28" y="160" clip-path="url(#c3)"><tspan class="p">didi@physical-ai</tspan><tspan class="w">:</tspan><tspan class="d">~</tspan><tspan class="w">$ cat stack.txt</tspan></text>
    <text x="28" y="190" clip-path="url(#c4)"><tspan class="m">&gt; </tspan><tspan class="y">Python</tspan><tspan class="m"> · </tspan><tspan class="k">OpenCV</tspan><tspan class="m"> · </tspan><tspan class="k">MediaPipe</tspan><tspan class="m"> · </tspan><tspan class="k">YOLO</tspan><tspan class="m"> · </tspan><tspan class="d">Arduino</tspan><tspan class="m"> · </tspan><tspan class="w">Next.js</tspan></text>
    <text x="28" y="220" clip-path="url(#c5)"><tspan class="p">didi@physical-ai</tspan><tspan class="w">:</tspan><tspan class="d">~</tspan><tspan class="w">$ ./build --robots --vision --games</tspan></text>
    <text x="28" y="250" clip-path="url(#c6)"><tspan class="m">&gt; compiling ideas </tspan><tspan class="p">████████████████████</tspan><tspan class="p"> 100%</tspan><tspan class="m">  [ok]</tspan></text>
    <text x="28" y="280" opacity="0"><tspan class="p">didi@physical-ai</tspan><tspan class="w">:</tspan><tspan class="d">~</tspan><tspan class="w">$ </tspan>
      <animate attributeName="opacity" values="0;1" begin="6.7s" dur="0.01s" fill="freeze"/>
    </text>
    <rect x="232" y="265" width="10" height="20" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" begin="6.7s" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
